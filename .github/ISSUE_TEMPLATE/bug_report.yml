name: Bug report
description: Report reproducible Agent IQ behavior that is incorrect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private tenant data, or exploitable security details.
        Use the private security-reporting path in SECURITY.md for vulnerabilities.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands or prompts that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Local showcase
        - Azure deployment
        - Cowork package
        - Foundry A2A agent
        - API or MCP
        - Canvas
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS and tool versions, but redact tenant and resource coordinates.
    validations:
      required: true
