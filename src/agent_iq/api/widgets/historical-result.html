<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historical Agent IQ result</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: transparent;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    main {
      display: grid;
      gap: 6px;
      padding: 14px 16px;
      color: CanvasText;
      background: color-mix(in srgb, Canvas 96%, #0f6cbd 4%);
      border-left: 3px solid #0f6cbd;
    }
    strong { font-size: 14px; line-height: 1.3; }
    p { margin: 0; max-width: 66ch; font-size: 13px; line-height: 1.45; opacity: .78; }
  </style>
</head>
<body>
  <main id="app" role="status">
    <strong>Historical Agent IQ experience</strong>
    <p>
      This saved conversation used an experience that is no longer active.
      Start a new conversation and ask the intent naturally so Agent IQ can
      discover the current eligible specialist or team.
    </p>
  </main>
  <script>
  (() => {
    "use strict";
    const app = document.getElementById("app");
    const requestId = 1;

    function notify(method, params) {
      const message = { jsonrpc: "2.0", method };
      if (params !== undefined) message.params = params;
      window.parent.postMessage(message, "*");
    }

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent || !event.data || typeof event.data !== "object") return;
      if (String(event.data.id) !== String(requestId)) return;
      notify("ui/notifications/initialized");
      notify("ui/notifications/size-changed", {
        height: Math.max(96, Math.ceil(app.getBoundingClientRect().height))
      });
    });

    window.parent.postMessage({
      jsonrpc: "2.0",
      id: requestId,
      method: "ui/initialize",
      params: {
        protocolVersion: "2026-01-26",
        appCapabilities: { availableDisplayModes: ["inline"] },
        appInfo: { name: "agent-iq-historical-result", version: "1.0.0" }
      }
    }, "*");
  })();
  </script>
</body>
</html>
